name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 测试与校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存
        uses: Swatinem/rust-cache@v2

      - name: 格式
        run: cargo fmt --all --check

      - name: 静态检查
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 单元测试（不需要 MaaFramework SDK）
        run: cargo test --workspace

      - name: Pipeline 校验（引用/锚点/图片/roi/孤儿）
        run: cargo run -p xtask -- pipeline-check

      - name: 零 Python 门禁
        run: ./scripts/check-no-python.sh

  ffI:
    name: FFI 编译（带 MaaFramework SDK）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 下载 MaaFramework SDK
        run: |
          gh release download --repo MaaXYZ/MaaFramework \
            --pattern "MAA-linux-x86_64-*.zip" --dir /tmp/maa
          unzip -q /tmp/maa/MAA-linux-x86_64-*.zip -d MAA-linux-x86_64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 编译 maa feature
        env:
          MAA_SDK_PATH: ${{ github.workspace }}/MAA-linux-x86_64
        run: cargo build -p maazure-daemon -p maazure-runner --features maa

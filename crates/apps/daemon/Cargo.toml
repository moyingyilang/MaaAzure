[package]
name = "maazure-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "maazure-daemon"
path = "src/main.rs"

[dependencies]
maazure-core.workspace = true
maazure-runner.workspace = true
serde_json = "1"

[features]
default = []
# 打通真实设备需要 MaaFramework SDK：cargo build -p maazure-daemon --features maa
maa = ["maazure-runner/maa"]
maa-dynamic = ["maazure-runner/maa-dynamic"]

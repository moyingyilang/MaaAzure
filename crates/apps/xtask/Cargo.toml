[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MaaAzure 资源转换与校验工具（不参与运行时）"

[[bin]]
name = "xtask"
path = "src/main.rs"

# 注意：这些依赖只属于开发工具。foundation / domain 仍然零依赖，
# 因此 `cargo test -p maazure-core -p maazure-vision -p maazure-battle -p maazure-daily`
# 在无网络、无 MaaFramework SDK 的机器上依然可跑。
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["gif", "png"] }

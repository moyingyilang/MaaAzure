[package]
name = "maazure-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "执行引擎边界：Tasker 驱动、调度器、录像回放"

[dependencies]
maazure-core.workspace = true
maazure-daily.workspace = true
maazure-vision.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# MaaFramework 绑定只在开了 `maa` feature 时参与构建。
# 默认关闭，让没有 SDK 的机器（含 Termux）也能 `cargo test` 整个 workspace。
# 启用方式：cargo build -p maazure-runner --features maa（需要 MAA-<platform>/ SDK）
[features]
default = []
# 静态链接：需要目标平台的 .so/.dll + 导入库（同平台构建时用）
maa = ["dep:maa-framework", "dep:image"]
# 动态加载：构建期不链接、运行期 libloading 找 MaaFramework 库。
# 跨平台构建（Linux 出 Windows 包）必须用这个 —— Windows 的 MSVC .lib 在 mingw 下读不了，
# 而 dynamic 模式根本不产生 link-lib 指令（见 maa-framework-sys build.rs:306）。
maa-dynamic = ["dep:maa-framework", "dep:image", "maa-framework/dynamic"]

# 合成帧控制器要把模板贴到 1280x720 底板上，所以只要 maa feature 才需要 image
[dependencies.image]
version = "0.25"
optional = true
default-features = false
features = ["png", "jpeg"]

[dependencies.maa-framework]
version = "1"
optional = true
features = ["toolkit", "adb", "custom"]

# Win32 控制器只在 Windows 目标上编译：MAA-linux 的 .so 不导出 Win32 符号。
[target.'cfg(windows)'.dependencies.maa-framework]
version = "1"
optional = true
features = ["toolkit", "adb", "custom", "win32"]

[workspace]
resolver = "3"
members = [
    # 1 地基：不依赖任何业务概念
    "crates/foundation/core",
    "crates/foundation/vision",
    # 2 领域：只依赖地基，纯逻辑、无 IO
    "crates/domain/battle",
    "crates/domain/daily",
    # 3 运行时：唯一接触 MaaFramework 的一层
    "crates/runtime/runner",
    # 4 应用：入口与工具
    "crates/apps/daemon",
    "crates/apps/xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/moyingyilang/MaaAzure"

[workspace.dependencies]
maazure-core = { path = "crates/foundation/core" }
maazure-vision = { path = "crates/foundation/vision" }
maazure-battle = { path = "crates/domain/battle" }
maazure-daily = { path = "crates/domain/daily" }
maazure-runner = { path = "crates/runtime/runner" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
